name: Update profile art

on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh-graph:
    runs-on: ubuntu-latest
    env:
      GH_PROFILE_USER: Sohan1606

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests beautifulsoup4 pillow numpy

      - name: Fetch contributions
        run: python fetch_contributions.py

      - name: Render heatmap SVG
        run: python generate_streak_svg.py $GH_PROFILE_USER contrib-heatmap.svg

      - name: Commit and push
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add contrib-heatmap.svg contributions.json || true
          git diff --cached --quiet || git commit -m "chore: refresh contribution graph [skip ci]"
          git push
